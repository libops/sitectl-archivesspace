name: integration-test

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: integration-test-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  create-archivesspace:
    name: sitectl create archivesspace ${{ matrix.create_definition }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - create_definition: default
            create_args: ""
    uses: libops/.github/.github/workflows/sitectl-create-smoke-test.yaml@4f6b4fe8dfb145a627fe7b73ceddd7304547f1a2 # main
    with:
      plugin: archivesspace
      create-definition: ${{ matrix.create_definition }}
      create-args: ${{ matrix.create_args }}
      template-repo: https://github.com/libops/archivesspace
      checkout-path: sitectl-archivesspace
      checkout-source: template
      project-path: archivesspace-site-template
      local-plugin-path: sitectl-archivesspace
      sitectl-repository: libops/sitectl
      sitectl-ref: 9bae54578003bfdfab0bb44c13ad4149501a7fc8 # v0.40.0
      package-versions: sitectl=0.40.0
      allow-unversioned-packages: false
      expected-template-lock-revision: v1.0.0

  integration-gate:
    name: sitectl create archivesspace default
    if: ${{ always() }}
    needs: create-archivesspace
    runs-on: ubuntu-latest
    steps:
      - name: Require successful create smoke test
        env:
          CREATE_RESULT: ${{ needs.create-archivesspace.result }}
        run: test "$CREATE_RESULT" = success
